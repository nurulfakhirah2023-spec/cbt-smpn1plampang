<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ujian Online CBT - SMPN 1 Plampang</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Portal Bersih Khusus Ujian -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="bg-indigo-950 px-6 py-1.5 text-xs text-indigo-200 flex justify-between items-center">
            <span>Portal Ujian Online SMPN 1 Plampang</span>
            <span>Tahun Pelajaran 2026/2027</span>
        </div>
        <div class="container mx-auto px-6 py-4 flex items-center space-x-4">
            <div class="bg-indigo-800 p-2.5 rounded-lg font-bold text-xl tracking-wider shadow-inner">SMPN 1</div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">SMPN 1 PLAMPANG</h1>
                <p class="text-xs md:text-sm text-indigo-200">Sistem Ujian Online CBT & Bank Soal</p>
            </div>
        </div>
    </header>

    <!-- Form Login Tengah -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Login Ujian</h2>
                <p class="text-sm text-gray-500 mt-1">Masukkan NISN, Kelas, dan Token Ujian Anda</p>
            </div>

            <form onsubmit="prosesLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username / NISN</label>
                    <input type="text" id="username" required placeholder="Contoh: 2026001" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                    <select id="kelas" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white">
                        <option value="VII-A">Kelas VII-A</option>
                        <option value="VII-B">Kelas VII-B</option>
                        <option value="VII-C">Kelas VII-C</option>
                        <option value="VIII-A">Kelas VIII-A</option>
                        <option value="VIII-B">Kelas VIII-B</option>
                        <option value="VIII-C">Kelas VIII-C</option>
                        <option value="IX-A">Kelas IX-A</option>
                        <option value="IX-B">Kelas IX-B</option>
                        <option value="IX-C">Kelas IX-C</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password / Token Ujian</label>
                    <input type="password" id="password" required placeholder="Contoh: PLM01" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>

                <button type="submit" id="btn-login" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 mt-2">
                    Masuk Ujian
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 SMPN 1 Plampang. All rights reserved.
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby9ikKOP_inH5BSVPbkFz64_pxO0mhPDTk0QnvFfUmxepF-j6G-zOH3DMYN_fK2d9LF/exec";

        function prosesLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const kelas = document.getElementById('kelas').value;
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('btn-login');

            btn.innerText = "Memverifikasi...";
            btn.disabled = true;

            // Cek jika yang login adalah Admin (sesuai data sheet Users Bapak)
            if (user.toLowerCase() === 'ardin' && pass === 'admin123') {
                localStorage.setItem('roleUser', 'Admin');
                window.location.href = "admin.html";
                return;
            }

            // Jika Siswa: Simpan identitas & kelas ke localStorage untuk dikirim bersama jawaban nanti
            localStorage.setItem('nisnSiswa', user);
            localStorage.setItem('kelasSiswa', kelas);
            localStorage.setItem('tokenSiswa', pass.toUpperCase());

            // Arahkan ke ruang ujian siswa
            window.location.href = "siswa.html";
        }
    </script>
</body>
</html>
