<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ujian Online CBT - SMPN 1 Plampang</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Bilah Navigasi Atas (Hanya Menyisakan Dashboard Admin) -->
    <div class="bg-gray-900 text-white p-2 flex justify-between items-center text-sm">
        <div class="px-4">
            <span class="font-semibold">Portal Ujian Online SMPN 1 Plampang</span>
        </div>
        <div class="space-x-2">
            <button onclick="bukaDashboardAdmin()" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-1 rounded font-medium">
                Dashboard Admin / Rilis Token
            </button>
        </div>
    </div>

    <!-- Header Portal Utama -->
    <header class="bg-indigo-900 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-800 p-2 rounded-lg font-bold text-xl">SMPN 1</div>
                <div>
                    <h1 class="text-xl font-bold">SMPN 1 PLAMPANG</h1>
                    <p class="text-sm text-indigo-200">Sistem Ujian Online CBT & Bank Soal</p>
                </div>
            </div>
            <span class="text-sm bg-indigo-800 px-3 py-1 rounded">Admin Ardin Yusuf</span>
        </div>
    </header>

    <!-- Konten Utama Login Ujian -->
    <main class="container mx-auto p-4 flex-grow flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Login Ujian</h2>
            <p class="text-sm text-center text-gray-500 mb-6">Masukkan Username / NISN dan Token Ujian</p>

            <form onsubmit="prosesLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Username / NISN</label>
                    <input type="text" id="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Contoh: 2026001" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Password / Token Ujian</label>
                    <input type="password" id="token" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Contoh: PLM01" required>
                </div>

                <button type="submit" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-bold py-2 px-4 rounded-lg shadow">
                    Masuk Ujian
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 SMPN 1 Plampang. All rights reserved.
    </footer>

    <script>
        // Fungsi Membuka Dashboard Admin
        function bukaDashboardAdmin() {
            window.location.href = "admin.html";
        }

        // Fungsi Proses Login Siswa
        function prosesLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const token = document.getElementById('token').value;

            // Simpan sesi sementara ke localStorage
            localStorage.setItem('nisnSiswa', username);
            localStorage.setItem('tokenSiswa', token);

            alert("Login berhasil! Mengarahkan ke ruang ujian...");
            window.location.href = "siswa.html";
        }
    </script>
</body>
</html>
