<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian Siswa - SMPN 1 Plampang</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans select-none" oncontextmenu="return false;">

    <!-- Header Ruang Ujian -->
    <header class="bg-indigo-900 text-white shadow-md p-4">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-800 p-2 rounded-lg font-bold text-xl">SMPN 1</div>
                <div>
                    <h1 class="text-xl font-bold">SMPN 1 PLAMPANG</h1>
                    <p class="text-xs text-indigo-200">Ruang Ujian Online (CBT) Siswa</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="bg-red-800 px-3 py-1 rounded text-xs font-semibold" id="warning-box">
                    Peringatan Curang: <span id="warning-count">0</span> / 3
                </div>
                <div class="bg-indigo-800 px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2">
                    <i class="fas fa-user-circle text-yellow-400"></i>
                    <span id="info-siswa">NISN: Loading...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Konten Utama Ujian -->
    <main class="container mx-auto p-4 md:p-6 flex-grow max-w-4xl">
        <!-- Card Informasi Ujian & Timer -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 flex flex-col md:flex-row justify-between items-center border border-gray-100 space-y-4 md:space-y-0">
            <div>
                <h2 id="mapel-title" class="text-xl font-bold text-gray-800">Mata Pelajaran: Memuat...</h2>
                <p class="text-sm text-gray-500">Pilihlah satu jawaban yang paling tepat pada setiap soal.</p>
            </div>
            <div class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg font-mono font-bold text-lg flex items-center space-x-2">
                <i class="fas fa-clock text-red-500"></i>
                <span>Sisa Waktu: <span id="timer">--:--:--</span></span>
            </div>
        </div>

        <!-- Card Lembar Soal -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100 space-y-6">
            <div id="loading-soal" class="text-center py-8 text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl text-indigo-600 mb-2"></i>
                <p>Sedang memuat data soal ujian...</p>
            </div>

            <div id="container-soal" class="hidden space-y-6">
                <!-- Soal akan di-render secara dinamis di sini -->
            </div>

            <!-- Tombol Kirim Jawaban -->
            <div class="pt-6 border-t flex justify-end">
                <button onclick="kirimSemuaJawaban()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md flex items-center space-x-2 transition">
                    <i class="fas fa-paper-plane"></i>
                    <span>Selesai & Kirim Jawaban</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 SMPN 1 Plampang. All rights reserved.
    </footer>

    <script>
        const API_URL = "ISI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA"; // Ganti dengan URL /exec Anda
        
        let dataJawaban = {};
        let sisaWaktuDetik = 3600; // Default 60 Menit
        let jumlahPeringatan = 0;

        window.onload = function() {
            const nisn = localStorage.getItem('nisnSiswa') || 'Peserta Ujian';
            const token = localStorage.getItem('tokenSiswa') || '-';
            document.getElementById('info-siswa').innerText = `NISN: ${nisn} | Token: ${token}`;

            loadSoalUjian();
            startTimer();
            aktifkanSistemAntiCurang();
        };

        // --- SISTEM ANTI-CURANG ---
        function aktifkanSistemAntiCurang() {
            // 1. Deteksi jika siswa pindah tab / keluar dari layar ujian
            document.addEventListener("visibilitychange", function() {
                if (document.hidden) {
                    jumlahPeringatan++;
                    document.getElementById('warning-count').innerText = jumlahPeringatan;
                    
                    if (jumlahPeringatan >= 3) {
                        alert("PERINGATAN KERAS! Anda telah 3 kali keluar dari halaman ujian. Ujian Anda akan otomatis dikirim.");
                        kirimSemuaJawaban();
                    } else {
                        alert(`PERINGATAN (${jumlahPeringatan}/3): Dilarang membuka tab atau aplikasi lain selama ujian berlangsung!`);
                    }
                }
            });

            // 2. Blokir kombinasi tombol salin / inspect element
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'p' || e.key === 's'))) {
                    e.preventDefault();
                    alert("Aksi ini dilarang selama ujian!");
                    return false;
                }
            });
        }

        function startTimer() {
            const timerElem = document.getElementById('timer');
            const interval = setInterval(() => {
                let jam = Math.floor(sisaWaktuDetik / 3600);
                let menit = Math.floor((sisaWaktuDetik % 3600) / 60);
                let detik = sisaWaktuDetik % 60;

                timerElem.innerText = 
                    `${jam.toString().padStart(2, '0')}:${menit.toString().padStart(2, '0')}:${detik.toString().padStart(2, '0')}`;

                if (sisaWaktuDetik <= 0) {
                    clearInterval(interval);
                    alert("Waktu ujian telah habis! Jawaban Anda akan otomatis dikirim.");
                    kirimSemuaJawaban();
                } else {
                    sisaWaktuDetik--;
                }
            }, 1000);
        }

        function loadSoalUjian() {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'getSoalUjian' })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-soal').classList.add('hidden');
                if(data.status === 'success') {
                    document.getElementById('mapel-title').innerText = "Mata Pelajaran: " + (data.mapel || "Ujian Online");
                    renderSoal(data.soal);
                } else {
                    document.getElementById('container-soal').innerHTML = `<p class="text-red-500 text-center font-semibold">${data.message}</p>`;
                    document.getElementById('container-soal').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('loading-soal').classList.add('hidden');
                document.getElementById('container-soal').innerHTML = `<p class="text-red-500 text-center font-semibold">Gagal memuat soal. Periksa koneksi internet Anda.</p>`;
                document.getElementById('container-soal').classList.remove('hidden');
            });
        }

        function renderSoal(listSoal) {
            const container = document.getElementById('container-soal');
            let html = '';

            listSoal.forEach((item, index) => {
                html += `
                <div class="border-b pb-6 last:border-b-0 space-y-3">
                    <p class="font-semibold text-gray-800 text-base leading-relaxed">
                        <span class="bg-indigo-100 text-indigo-800 px-2 py-1 rounded text-sm font-bold mr-2">${index + 1}</span>
                        ${item.pertanyaan}
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-4">
                        <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-indigo-50 cursor-pointer transition">
                            <input type="radio" name="soal_${item.id}" value="A" onchange="simpanJawaban('${item.id}', 'A')" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-sm font-medium text-gray-700">A. ${item.opsiA}</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-indigo-50 cursor-pointer transition">
                            <input type="radio" name="soal_${item.id}" value="B" onchange="simpanJawaban('${item.id}', 'B')" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-sm font-medium text-gray-700">B. ${item.opsiB}</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-indigo-50 cursor-pointer transition">
                            <input type="radio" name="soal_${item.id}" value="C" onchange="simpanJawaban('${item.id}', 'C')" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-sm font-medium text-gray-700">C. ${item.opsiC}</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-indigo-50 cursor-pointer transition">
                            <input type="radio" name="soal_${item.id}" value="D" onchange="simpanJawaban('${item.id}', 'D')" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-sm font-medium text-gray-700">D. ${item.opsiD}</span>
                        </label>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            container.classList.remove('hidden');
        }

        function simpanJawaban(soalId, pilihan) {
            dataJawaban[soalId] = pilihan;
        }

        function kirimSemuaJawaban() {
            if (!confirm("Apakah Anda yakin ingin menyelesaikan ujian dan mengirim semua jawaban?")) return;

            const nisn = localStorage.getItem('nisnSiswa') || '2026001';

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'submitJawaban',
                    nisn: nisn,
                    jawaban: dataJawaban
                })
            })
            .then(res => res.json())
            .then(res => {
                alert("Jawaban ujian Anda berhasil terkirim!");
                window.location.href = "index.html";
            })
            .catch(err => {
                alert("Terjadi kesalahan saat menyimpan jawaban, silakan coba lagi.");
            });
        }
    </script>
</body>
</html>
