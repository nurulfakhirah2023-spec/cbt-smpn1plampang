<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian Siswa - SMPN 1 PLAMPANG</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header Portal Siswa -->
    <header class="bg-indigo-900 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">SMPN 1 PLAMPANG</h1>
                <p class="text-sm text-indigo-200">Sistem Ujian Online (CBT) Siswa</p>
            </div>
            <span id="info-nisn-token" class="text-sm bg-indigo-800 px-3 py-1 rounded">Memuat Sesi...</span>
        </div>
    </header>

    <!-- Konten Utama Ruang Ujian -->
    <main class="container mx-auto p-4 flex-grow max-w-4xl">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 id="nama-mapel" class="text-lg font-bold text-gray-800">Mata Pelajaran: Memuat...</h2>
                <div id="timer" class="bg-red-100 text-red-700 px-4 py-2 rounded font-bold text-sm">Sisa Waktu: --:--:--</div>
            </div>

            <!-- Area Soal -->
            <div id="container-soal" class="space-y-6">
                <p class="text-center text-gray-500 py-8">Sedang memuat soal dari database...</p>
            </div>
        </div>

        <div class="flex justify-end">
            <button onclick="kirimJawaban()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-lg shadow">
                Selesai & Kirim Jawaban
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 SMPN 1 Plampang. All rights reserved.
    </footer>

    <script>
        // PENTING: Ganti URL di bawah ini dengan URL Web App Google Apps Script terbaru Anda setelah Deploy
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzjOXG6MozvFdVWDwASHAbfOcwUFQaceotQ10TssCUY9pp14IdPsYu5uaI7-NJWP1Rx/exec";

        // Ambil token / NISN dari localStorage (disimpan saat login siswa)
        const tokenSiswa = localStorage.getItem('tokenSiswa') || "OM7L4"; 
        const nisnSiswa = localStorage.getItem('nisnSiswa') || "Shohibul Khaer";

        document.getElementById('info-nisn-token').innerText = `NISN: ${nisnSiswa} | Token: ${tokenSiswa}`;

        window.onload = function() {
            loadSoal(tokenSiswa);
            aktifkanAntiCurang();
        };

        // 1. Fungsi Memuat Soal dari Google Sheets
        function loadSoal(token) {
            fetch(URL_WEB_APP, {
                method: 'POST',
                redirect: 'follow', // Mengatasi redirect Google Apps Script
                body: JSON.stringify({
                    action: 'getSoal',
                    token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('nama-mapel').innerText = "Mata Pelajaran: " + data.mapel;
                    
                    let htmlSoal = "";
                    data.soal.forEach((s, index) => {
                        htmlSoal += `
                            <div class="p-4 border rounded-lg bg-gray-50">
                                <p class="font-semibold text-gray-800 mb-3">Soal ${index + 1}: ${s.pertanyaan}</p>
                                <div class="space-y-2">
                                    <label class="block"><input type="radio" name="soal_${s.id}" value="A" class="mr-2"> A. ${s.opsiA}</label>
                                    <label class="block"><input type="radio" name="soal_${s.id}" value="B" class="mr-2"> B. ${s.opsiB}</label>
                                    <label class="block"><input type="radio" name="soal_${s.id}" value="C" class="mr-2"> C. ${s.opsiC}</label>
                                    <label class="block"><input type="radio" name="soal_${s.id}" value="D" class="mr-2"> D. ${s.opsiD}</label>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('container-soal').innerHTML = htmlSoal;
                } else {
                    document.getElementById('container-soal').innerHTML = `<p class="text-center text-red-600 font-semibold">${data.message}</p>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('container-soal').innerHTML = `<p class="text-center text-red-600 font-semibold">Gagal terhubung ke database server.</p>`;
            });
        }

        // 2. Sistem Anti-Curang
        function aktifkanAntiCurang() {
            let jumlahPelanggaran = 0;
            const MAKS_PELANGGARAN = 3;

            // Deteksi pindah tab / minimize browser
            document.addEventListener("visibilitychange", function() {
                if (document.hidden) {
                    jumlahPelanggaran++;
                    if (jumlahPelanggaran < MAKS_PELANGGARAN) {
                        alert(`Peringatan (${jumlahPelanggaran}/${MAKS_PELANGGARAN})! Anda dilarang meninggalkan halaman ujian.`);
                    } else {
                        alert("Anda terdeteksi sering meninggalkan halaman. Ujian diserahkan otomatis.");
                        kirimJawaban();
                    }
                }
            });

            // Blokir Klik Kanan
            document.addEventListener("contextmenu", e => e.preventDefault());

            // Blokir Tombol F12 & Shortcut Inspect/Copy
            document.addEventListener("keydown", function(e) {
                if (e.key === "F12" || (e.ctrlKey && ["u", "c", "v", "i", "I", "U", "C"].includes(e.key))) {
                    e.preventDefault();
                    alert("Aksi ini dikunci selama ujian berlangsung!");
                    return false;
                }
            });
        }

        function kirimJawaban() {
            if(confirm("Apakah Anda yakin ingin mengirim jawaban ujian ini?")) {
                alert("Jawaban berhasil dikirim!");
                window.location.href = "index.html"; // Kembali ke halaman utama/login
            }
        }
    </script>
</body>
</html>
